<section class="search-hero"><div class="container"><div class="hero-canvas-wrapper"><h1 class="search-hero__title">Trova la tua bicicletta</h1></div><div class="search-input-wrapper"><input id="advanced-search-input" type="text" placeholder="Cerca bicicletta, categoria, caratteristiche..." class="search-input"/><svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M9 17C13.4183 17 17 13.4183 17 9C17 4.58172 13.4183 1 9 1C4.58172 1 1 4.58172 1 9C1 13.4183 4.58172 17 9 17Z" stroke="currentColor" stroke-width="2"/><path d="M19 19L14.65 14.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="shader-morph-container"></div></div></section><section class="search-page-main"><div class="container-wide"><aside class="filters-sidebar"><div class="filters-header"><h3>Filtra per</h3><button data-clear-filters class="btn-clear">Cancella tutto</button></div><div class="filter-group"><h4 class="filter-title">Categoria</h4><div class="filter-options"><label class="filter-checkbox"><input type="checkbox" data-filter-category="mtb"/><span>Mountain Bike</span></label><label class="filter-checkbox"><input type="checkbox" data-filter-category="road"/><span>Bici da Strada</span></label><label class="filter-checkbox"><input type="checkbox" data-filter-category="city"/><span>Bici da Città</span></label><label class="filter-checkbox"><input type="checkbox" data-filter-category="ebike"/><span>E-Bike</span></label><label class="filter-checkbox"><input type="checkbox" data-filter-category="gravel"/><span>Gravel</span></label></div></div><div class="filter-group"><h4 class="filter-title">Fascia di Prezzo</h4><div class="price-inputs"><input type="number" id="price-min" placeholder="Min €"/><span>-</span><input type="number" id="price-max" placeholder="Max €"/></div></div><div class="filter-group"><h4 class="filter-title">Tipo Motore</h4><div class="filter-options"><label class="filter-checkbox"><input type="checkbox" data- line:0;border-color:var(--atala-blue);box-shadow:0 12px 40px rgba(53,105,241,.2);transform:translateY(-2px)}.search-icon{position:absolute;right:24px;top:50%;transform:translateY(-50%);color:var(--atala-blue);pointer-events:none}.shader-morph-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;z-index:1;opacity:.6}.search-page-main{padding:80px 0;background:var(--atala-white)}.search-page-main .container-wide{display:grid;grid-template-columns:280px 1fr;gap:48px}.filters-sidebar{position:sticky;top:24px;height:fit-content}.filters-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.filters-header h3{font-size:24px;font-weight:700;margin:0}.btn-clear{background:0 0;border:none;color:var(--atala-blue);font-size:14px;cursor:pointer;padding:8px 12px;border-radius:6px;transition:background .2s}.btn-clear:hover{background:var(--atala-light-gray)}.filter-group{margin-bottom:32px;padding-bottom:32px;border-bottom:1px solid var(--atala-light-gray)}.filter-group:last-child{border-bottom:none}.filter-title{font-size:16px;font-weight:600;margin:0 0 16px 0;color:var(--atala-dark)}.filter-options{display:flex;flex-direction:column;gap:12px}.filter-checkbox{display:flex;align-items:center;cursor:pointer;font-size:15px;color:var(--atala-dark)}.filter-checkbox input[type=checkbox]{margin-right:12px;width:20px;height:20px;cursor:pointer;accent-color:var(--atala-blue)}.price-inputs{display:flex;align-items:center;gap:12px}.price-inputs input{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px}.sort-select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:15px;cursor:pointer;background:var(--atala-white)}.results-container{min-height:600px}.results-header{margin-bottom:32px}.results-header h2{font-size:32px;font-weight:700;margin:0}.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:32px}.product-card{background:var(--atala-white);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:all .3s cubic-bezier(.34,1.56,.64,1);cursor:pointer}.product-card:hover{transform:translateY(-8px);box-shadow:0 12px 30px rgba(53,105,241,.15)}.product-image{width:100%;height:250px;object-fit:cover}.product-card h3{font-size:20px;font-weight:600;margin:16px 20px 8px;color:var(--atala-dark)}.product-price{font-size:24px;font-weight:700;color:var(--atala-blue);margin:0 20px 16px}.btn--quick-view{width:calc(100% - 40px);margin:0 20px 20px;padding:14px 24px;background:var(--atala-blue);color:var(--atala-white);border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1)}.btn--quick-view:hover{background:#2856d0;transform:scale(1.02)}.products-loading{grid-column:1/-1;text-align:center;padding:80px 20px;color:#666}@media (max-width:1024px){.search-page-main .container-wide{grid-template-columns:1fr}.filters-sidebar{position:static}.products-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}@media (max-width:768px){.search-hero{min-height:50vh;padding:40px 0}.search-hero__title{font-size:48px}.search-input-wrapper{max-width:100%}.shader-morph-container{width:300px;height:300px}.products-grid{grid-template-columns:1fr;gap:24px}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.product-card{animation:fadeInUp .5s ease-out forwards}.product-card:nth-child(1){animation-delay:.05s}.product-card:nth-child(2){animation-delay:.1s}.product-card:nth-child(3){animation-delay:.15s}.product-card:nth-child(4){animation-delay:.2s}.product-card:nth-child(5){animation-delay:.25s}.product-card:nth-child(6){animation-delay:.3s}</style>
